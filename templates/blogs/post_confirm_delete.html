{% extends "base.html" %}
 
{% block title %}
    Delete Post | Ink-Space
{% endblock %}
 
{% block content %}
 
<div class="row justify-content-center">
 
    <div class="col-lg-6">
 
        <div class="card shadow-sm">
 
            <div class="card-body p-4">
 
                <h1 class="h3 mb-3">
                    Delete Post
                </h1>
 
                <p>
                    Are you sure you want to delete
                    "<strong>{{ post.title }}</strong>"?
                </p>
 
                <form method="post">
 
                    {% csrf_token %}
 
                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Yes, Delete
                    </button>
 
                    <a
                        href="{% url 'post_detail' post.id %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>
 
                </form>
 
            </div>
 
        </div>
 
    </div>
 
</div>
 
{% endblock %}
